><circle cx="40" cy="30" r="5" fill="none" stroke="#f2e8d8" stroke-width=".8"/></pattern><clipPath id="fc"><rect x="1" y="1" width="878" height="94" rx="14"/></clipPath></defs><g clip-path="url(#fc)"><rect x="0" y="0" width="880" height="96" fill="url(#fw)" opacity=".13"/></g><rect x="300" y="26" width="280" height="44" rx="22" fill="#12100e"/><text x="440.0" y="48" text-anchor="middle" class="s fade" font-size="18" fill="#f2e8d8" letter-spacing="6">一期一会</text><text x="440.0" y="64" text-anchor="middle" class="m fade" font-size="10" fill="#6b635a" style="animation-delay:0.20s">© 2026 Matheus · Brasil</text></svg>