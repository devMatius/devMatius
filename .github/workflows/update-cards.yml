name: update README cards

on:
  schedule:
    - cron: "17 3 * * *" # diário, 00:17 em Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-cards.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render cards
        # GITHUB_TOKEN só enxerga contribuições públicas. Para incluir as privadas,
        # crie um PAT clássico com escopo read:user no secret CARDS_TOKEN.
        env:
          GITHUB_TOKEN: ${{ secrets.CARDS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/render_cards.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards data README.md
          git diff --cached --quiet || git commit -m "chore: refresh README cards"
          git push
